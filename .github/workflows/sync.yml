name: Sync index.html from GtoMnK

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Fetch latest file from GtoMnK
        run: |
          curl -sL \
            https://raw.githubusercontent.com/SAM1430B/GtoMnK/master/GtoMnK_DLL/Documents/GtoMnK_Config.html \
            -o index.html

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Sync index.html from GtoMnK upstream"
          git push
